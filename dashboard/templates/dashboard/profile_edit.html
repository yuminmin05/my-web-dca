<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขโปรไฟล์ | DCA Investment System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-slate-900 min-h-screen font-sans">

<div class="max-w-2xl mx-auto p-6 md:p-10">

    <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-extrabold text-white">แก้ไขโปรไฟล์</h1>
        <a href="{% url 'profile' %}" class="bg-white text-emerald-800 px-6 py-2 rounded-xl font-semibold shadow hover:bg-emerald-50">
            ← ยกเลิก
        </a>
    </div>

    <!-- Messages -->
    {% if messages %}
        {% for message in messages %}
        <div class="mb-6 p-4 rounded-xl bg-green-100 border border-green-500 text-green-800">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <!-- Edit Form -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <form method="POST" action="{% url 'profile_edit' %}" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- ชื่อ -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">ชื่อ</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                </div>

                <!-- นามสกุล -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">นามสกุล</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                </div>
            </div>

            <!-- อีเมล -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">อีเมล</label>
                <input type="email" name="email" value="{{ user.email }}" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">เบอร์โทรศัพท์</label>
                <input type="tel" name="phone" value="{{ profile.phone }}" placeholder="+66..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
            </div>

            <!-- ภาษาที่ต้องการ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">ภาษาที่ต้องการ</label>
                <select name="preferred_language" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    <option value="th" {% if profile.preferred_language == 'th' %}selected{% endif %}>ไทย</option>
                    <option value="en" {% if profile.preferred_language == 'en' %}selected{% endif %}>English</option>
                </select>
            </div>

            <!-- เกี่ยวกับตัวเอง -->
            <div>
                <label class="block text-gray-700 font-semibold mb-2">เกี่ยวกับตัวเอง</label>
                <textarea name="bio" rows="4" placeholder="เขียนข้อมูลเพิ่มเติมเกี่ยวกับตัวเอง..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent">{{ profile.bio }}</textarea>
            </div>

            <!-- Submit Button -->
            <div class="flex gap-4 pt-6">
                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition-all">
                    ✓ บันทึกการเปลี่ยนแปลง
                </button>
                <a href="{% url 'profile' %}" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-3 rounded-xl transition-all text-center">
                    ยกเลิก
                </a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
